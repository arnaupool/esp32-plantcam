# Producción: descarga la imagen que publica GitHub Actions en ghcr.io (ver docs/DEPLOY.md).
# Las cuatro variables con ":?" son obligatorias: si falta alguna, el despliegue falla en vez de
# arrancar con un secreto vacío.
services:
  plantcam:
    image: ghcr.io/arnaupool/plantcam:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?define SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?define ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?define ADMIN_PASSWORD}
      PROVISIONING_SECRET: ${PROVISIONING_SECRET:?define PROVISIONING_SECRET}
    volumes:
      - plantcam_data:/data

volumes:
  plantcam_data:
