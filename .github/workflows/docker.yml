# Cada push a main: prueba la imagen y publica ghcr.io/<usuario>/plantcam:latest
name: Imagen Docker

on:
  push:
    branches: [main]
    # Cambios solo de documentación, plantillas o firmware no reconstruyen la imagen.
    paths-ignore:
      - "docs/**"
      - "unraid/**"
      - "firmware/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Importar la app
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -c "import app.main"
      - name: Construir la imagen
        run: docker build -t plantcam:ci .
      - name: Prueba de humo
        run: |
          docker run -d --name pc -p 8000:8000 \
            -e SECRET_KEY=ci-secret-ci-secret-ci-secret-0123 \
            -e ADMIN_USERNAME=admin -e ADMIN_PASSWORD=ci -e PROVISIONING_SECRET=ci-prov \
            plantcam:ci
          for i in $(seq 1 30); do curl -fs http://localhost:8000/health && break; sleep 1; done
          echo "--- API en la raíz y bajo /api"
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/api/health
          echo "--- panel servido por el mismo contenedor"
          curl -fsS http://localhost:8000/ | grep -c "PlantCam"
          curl -fsS http://localhost:8000/js/api.js | grep -c "API_BASE"
          echo "--- login y alta de dispositivo por las dos rutas"
          curl -fsS -X POST http://localhost:8000/api/auth/login \
            -H 'content-type: application/json' -d '{"username":"admin","password":"ci"}' | cut -c1-40
          curl -fsS -X POST http://localhost:8000/devices/register \
            -H 'content-type: application/json' -d '{"provisioning_secret":"ci-prov","name":"raiz"}'
          curl -fsS -X POST http://localhost:8000/api/devices/register \
            -H 'content-type: application/json' -d '{"provisioning_secret":"ci-prov","name":"api"}'
          echo "--- ffmpeg dentro de la imagen"
          docker exec pc ffmpeg -version | head -1
          echo "--- foto real: subida, rotación 90 y miniatura girada (Pillow)"
          REG=$(curl -fsS -X POST http://localhost:8000/devices/register \
            -H 'content-type: application/json' -d '{"provisioning_secret":"ci-prov","name":"foto"}')
          DID=$(echo "$REG" | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])")
          KEY=$(echo "$REG" | python3 -c "import sys,json;print(json.load(sys.stdin)['api_key'])")
          docker exec pc ffmpeg -loglevel error -f lavfi -i testsrc=size=640x480 -frames:v 1 /tmp/t.jpg
          docker cp pc:/tmp/t.jpg t.jpg
          curl -fsS -X POST http://localhost:8000/devices/$DID/photos -H "X-API-Key: $KEY" -F "file=@t.jpg;type=image/jpeg"
          TOKEN=$(curl -fsS -X POST http://localhost:8000/api/auth/login \
            -H 'content-type: application/json' -d '{"username":"admin","password":"ci"}' \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
          curl -fsS -X PATCH http://localhost:8000/api/devices/$DID -H "Authorization: Bearer $TOKEN" \
            -H 'content-type: application/json' -d '{"rotation":90}' > /dev/null
          PHOTO=$(curl -fsS http://localhost:8000/api/devices/$DID/photos -H "Authorization: Bearer $TOKEN" \
            | python3 -c "import sys,json;print(json.load(sys.stdin)[0]['id'])")
          curl -fsS "http://localhost:8000/api/devices/$DID/photos/$PHOTO/image?size=thumb" \
            -H "Authorization: Bearer $TOKEN" -o thumb.jpg
          # Ancho y alto de la cabecera SOF0 del JPEG: 640x480 girado 90° y reducido a 480 px queda en 360x480.
          python3 -c "import struct;d=open('thumb.jpg','rb').read();i=d.find(bytes([255,192]));h,w=struct.unpack('>HH',d[i+5:i+9]);print('miniatura',w,'x',h);assert (w,h)==(360,480)"
      - name: La imagen no arranca sin secretos
        run: |
          if docker run --rm plantcam:ci; then
            echo "El contenedor arrancó sin secretos"; exit 1
          fi

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/plantcam:latest
            ghcr.io/${{ github.repository_owner }}/plantcam:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
