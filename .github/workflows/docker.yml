# Cada push a main: comprueba el backend, prueba las imágenes y publica
# ghcr.io/<usuario>/plantcam-backend:latest y plantcam-frontend:latest
name: Imágenes Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Importar la app
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -c "import app.main"
      - name: Construir imágenes
        run: |
          docker build -t plantcam-backend:ci backend
          docker build -t plantcam-frontend:ci frontend
      - name: Prueba de humo del backend
        run: |
          docker run -d --name pc -p 8000:8000 \
            -e DATABASE_URL=sqlite:////data/db/plantcam.db \
            -e PHOTOS_DIR=/data/photos -e TIMELAPSES_DIR=/data/timelapses \
            -e SECRET_KEY=ci-secret-ci-secret-ci-secret-0123 \
            -e ADMIN_USERNAME=admin -e ADMIN_PASSWORD=ci -e PROVISIONING_SECRET=ci-prov \
            plantcam-backend:ci
          for i in $(seq 1 30); do curl -fs http://localhost:8000/health && break; sleep 1; done
          curl -fsS http://localhost:8000/health
          curl -fsS -X POST http://localhost:8000/devices/register \
            -H 'content-type: application/json' \
            -d '{"provisioning_secret":"ci-prov","name":"ci"}'
          docker exec pc ffmpeg -version | head -1
      - name: El backend no arranca sin secretos
        run: |
          if docker run --rm plantcam-backend:ci; then
            echo "El backend arrancó sin secretos"; exit 1
          fi
      - name: Validar nginx
        run: |
          docker run --rm --add-host backend:127.0.0.1 plantcam-frontend:ci nginx -t
          docker run --rm -e BACKEND_URL=http://192.168.1.150:8000 plantcam-frontend:ci nginx -T \
            | grep -F "proxy_pass http://192.168.1.150:8000/;"

  images:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/plantcam-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/plantcam-${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
