server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Fotos del ESP32 (hasta ~2 MB a 5MP) y timelapses largos pasan por /api.
    client_max_body_size 20m;

    # ${BACKEND_URL} lo sustituye nginx al arrancar (ver Dockerfile).
    location /api/ {
        proxy_pass ${BACKEND_URL}/;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
